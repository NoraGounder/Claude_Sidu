# Suction and dock/mop names come from Roborock's own EU store pages (Nov 2026)
# where shown; the rest is model-line knowledge. confidence: high = from the
# store page, medium = known model line, low = inferred. Verify on the product
# page before buying. Models without a row get no score and are listed unscored.
#
# rtings = RTINGS overall lab score (0-10), robot-vacuum reviews, read 27 Nov 2026.
# Ranking uses rtings x 10 where tested; the rubric below only fills gaps (marked estimated).
#
# Rubric (0-100):
