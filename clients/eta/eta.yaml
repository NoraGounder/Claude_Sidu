# ETA search: the buy box, the search plan and the sieve-1 checklist.
# Every number here is a starting guess from the board (investment checklist, Permanent Equity checks,
# Stanford Primer). Sidarth sets the real bars once (board: "Your part"); decisions.md records changes.

market: GB            # milestone 1: UK first (decisions.md E1). Poland next (KRS + RDF filings).

# ---------- Where candidates come from (Companies House advanced search) ----------
search:
  company_type: ltd                # private limited companies only
  company_status: active
  incorporated_to: "2015-12-31"    # 10+ years old (checklist: consistent history)
  page_size: 500                   # companies per request (API maximum 5000)
  max_per_code_per_run: 1000       # each run continues where the last one stopped
  # Industry-agnostic in principle (the buy box says "any industry"), but a search needs a list.
  # These are essential, unglamorous, recurring B2B services and light industry: the "boring business"
  # profile Permanent Equity and the board's value rules point to. Add or remove codes freely.
  sic_codes:
    33120: Repair of machinery
    33130: Repair of electronic and optical equipment
    33140: Repair of electrical equipment
    33190: Repair of other equipment
    33200: Installation of industrial machinery and equipment
    37000: Sewerage
    38110: Collection of non-hazardous waste
    38120: Collection of hazardous waste
    39000: Remediation and other waste management
    43210: Electrical installation
    43220: Plumbing, heat and air-conditioning installation
    43290: Other construction installation
    43910: Roofing activities
    71121: Engineering design for industrial process and production
    71122: Engineering-related scientific and technical consulting
    71129: Other engineering activities
    71200: Technical testing and analysis
    74901: Environmental consulting
    80200: Security systems service activities
    81210: General cleaning of buildings
    81222: Specialised cleaning services
    81229: Other building and industrial cleaning
    81291: Disinfecting and exterminating services
    81300: Landscape service activities
    25610: Treatment and coating of metals
    25620: Machining
    28290: Other general-purpose machinery
    26511: Electronic measuring and testing equipment
    46690: Wholesale of other machinery and equipment
    77320: Renting of construction machinery and equipment
    77390: Renting of other machinery and equipment
    52290: Other transportation support activities

# Dropped before any further request: holding vehicles, property, finance, dormant shells.
exclude:
  sic_codes: [64209, 64205, 64999, 68100, 68209, 68320, 70100, 99999, 74990]
  name_keywords: [holdings, holding, investments, property, properties, estates, nominees,
                  "management company", "rtm company", trustees, "pension", "(uk) branch"]

# ---------- Sieve 1: Stanford company criteria, on public numbers only ----------
# Source: Stanford GSB, "2026 A Primer on Search Funds", Part IV (p.23-28): desirable and undesirable
# company criteria. Dollar figures converted at £0.79 per $ (decisions.md E5). The Primer calls these "a
# framework of ideal circumstances, not absolute restrictions", so only the clearly undesirable cases that the
# register can prove are hard fails; the rest are scored. Unknowns are never a fail: they go to the ledger.
sieve1:
  hard:                                       # Primer "undesirable" (company), when the register shows it
    min_years: 10                             # history of cash flow generation
    accounts_types_allowed: [full, medium, small, group, total-exemption-full, total-exemption-small,
                             audited-abridged, unaudited-abridged]   # left out: dormant, micro-entity, subsidiary exemptions
    exclude_insolvency_history: true          # turnaround situation
    exclude_overdue_accounts: true
    exclude_corporate_majority_owner: true    # owned by a group or fund: no motivated owner-seller
    max_accounts_age_months: 24
    min_net_assets_gbp: 1                     # negative equity: a turnaround
    exclude_loss_making: true                 # operating loss in the latest year: a turnaround
    turnover_min_gbp: 8000000                 # "small company: less than $10 million in revenue"
    ebitda_min_gbp: 1200000                   # "... or $1.5 million in EBITDA"
    turnover_max_gbp: 24000000                # above $30M "may be too complex" for a first-time CEO
    employees_min: 20                         # implied by the revenue floor; catches tiny firms with no P&L filed
    employees_max: 500
  bars:                                       # Primer "desirable" (company), scored
    turnover_target_gbp: [8000000, 24000000]  # "$10 million to $30 million in revenue"
    ebitda_target_gbp: [1200000, 4000000]     # "greater than $1.5 million in EBITDA"; most success at $1.5-5M
    ebitda_margin_target: 0.15                # "EBITDA margins of greater than 15 percent ... margin of safety"
    ebitda_margin_floor: 0.10                 # "under 10 percent: a dangerously thin margin for error"
    rotc_target: 0.20                         # "healthy and sustainable profit margins (ROTC > 20%)"
    retained_earnings_growth_years: 2         # profit proxy when no P&L is filed
    net_debt_to_net_assets_max: 1.0
    owner_age_motivated: 60                   # "motivated seller for non-business reasons" (retirement)
    owner_age_watch: 55
    bench_directors_under_55: 1               # "solid middle management" proxy: a younger director exists
  weights:                                    # add up to 100
    financial_size: 20      # revenue and EBITDA in the Stanford range
    profitability: 20       # EBITDA margin vs 15% (proxy: retained earnings growth)
    return_on_capital: 10   # ROTC proxy: operating profit / capital employed
    cash_history: 10        # years trading and growing equity
    motivated_seller: 15    # majority owner's age
    management_bench: 15    # younger directors next to the owner
    balance_sheet: 10       # low debt today
  pass_score: 60
  review_score: 40

# ---------- Sieve 2a: Stanford industry scorecard (Primer p.30), one Jev decision per SIC code ----------
# Ten criteria, each 1 (low fit) to 3 (high fit), out of 30. Scored once per industry code and reused for every
# company in it. The Primer's example industries scored 20-28.
industry_scorecard:
  min_score: 22
  criteria:
    fragmented: "Fragmented industry: many small players, no dominant consolidator"
    growing: "Industry growing, ideally with a tailwind"
    recurring_revenue: "Recurring revenue model: regular payments from customers who stay 18+ months"
    sizable: "Sizable industry: total revenue and number of companies"
    healthy_margins: "Healthy and sustainable margins (return on tangible capital above 20%)"
    straightforward: "Straightforward operations a first-time CEO can learn quickly"
    barriers_to_entry: "High barriers to entry"
    low_customer_concentration: "Low customer concentration and low customer pricing power"
    no_consolidation: "No consolidation trend by strategic buyers bidding up prices"
    low_exogenous_risk: "Low exogenous risk: regulation, payment, technology, AI displacement, commodity, fads"

# ---------- Sieve 2b: Hamilton Helmer's 7 Powers (Jev 1.14 on the company's own website) ----------
# A Power is a Benefit (better cash flow) protected by a Barrier (competitors cannot copy it).
# Small private firms rarely show more than one or two; the website is weak evidence, so this ranks rather than
# drops, and every Power found becomes a claim in the evidence ledger, status "unverified", to test with the owner.
seven_powers:
  min_clear_powers: 1          # at least one Power with clear evidence to count as "qualified"
  powers:
    scale_economies: "Scale economies: unit cost falls as volume grows (route density, shared depots, purchasing)"
    network_economies: "Network economies: the service is worth more to each customer as more customers use it"
    counter_positioning: "Counter-positioning: a business model incumbents cannot copy without hurting their own"
    switching_costs: "Switching costs: customers lose money, time or certification by changing supplier"
    branding: "Branding: customers pay more for the same thing because of reputation and trust built over years"
    cornered_resource: "Cornered resource: preferential access to something valuable (licence, accreditation, permit, contract, people)"
    process_power: "Process power: embedded ways of working that give lower cost or better quality and take years to copy"

# ---------- Qualification ----------
# qualified  = sieve 1 pass + industry score >= min_score + at least min_clear_powers Power with clear evidence
# watch      = sieve 1 pass or review, but sieve 2 short of the bar or unknown
qualification:
  max_websites_per_run: 200

# ==================================================================================================
# United States (decisions.md E6). There is no public register of private-company accounts in the US, so
# discovery and size come from the SBA's public Paycheck Protection Program file (loans of $150k+, 2020-21):
# every borrower's NAICS code, jobs reported and loan amount. A first-draw loan was 2.5 months of payroll
# (pay capped at $100k a head), so annual payroll ~ 4.8 x loan; revenue ~ payroll / the industry's payroll
# share. These are estimates (ledger status "unverified"): real numbers come from the seller.
# ==================================================================================================
us:
  ppp_url: https://data.sba.gov/sites/default/files/distribution/SBA-OCA-2022-07-001/public_150k_plus_240930.csv
  naics_codes:                     # the same "boring B2B" profile as the UK list
    811310: Commercial and industrial machinery repair
    811210: Electronic and precision equipment repair
    238210: Electrical contractors
    238220: Plumbing, heating and air-conditioning contractors
    238290: Other building equipment contractors
    238160: Roofing contractors
    541330: Engineering services
    541380: Testing laboratories
    541620: Environmental consulting services
    561621: Security systems services
    561720: Janitorial services
    561710: Exterminating and pest control services
    561730: Landscaping services
    562111: Solid waste collection
    562112: Hazardous waste collection
    562910: Remediation services
    221320: Sewage treatment facilities
    332813: Electroplating, plating, polishing and coloring
    332710: Machine shops
    333998: All other miscellaneous general purpose machinery
    334515: Instruments for measuring and testing electricity
    423830: Industrial machinery and equipment merchant wholesalers
    532412: Construction and mining machinery rental
    532490: Other commercial and industrial machinery rental
    488490: Other support activities for road transportation
  # payroll as a share of revenue, by NAICS prefix (longest prefix wins); rough Census averages
  payroll_share: {"22": 0.15, "23": 0.25, "31": 0.20, "32": 0.20, "33": 0.20, "3327": 0.33, "42": 0.07,
                  "48": 0.30, "53": 0.20, "54": 0.40, "56": 0.40, "562": 0.25, "81": 0.33}
  payroll_multiple: 4.8            # annual payroll per $ of first-draw loan (12 / 2.5)
  revenue_band: 0.3                # the revenue estimate is +/- 30%
  prefilter:                       # applied while the file streams; everything else is dropped unread
    jobs_min: 15
    jobs_max: 600
    revenue_estimate_min_usd: 5000000
    business_types: ["Corporation", "Subchapter S Corporation", "Limited  Liability Company(LLC)",
                     "Limited Liability Company(LLC)", "Limited Liability Partnership", "Partnership"]
    states: []                     # empty = all states
  sieve1:
    hard:
      revenue_min_usd: 8000000     # central estimate; Stanford's floor is $10M, kept lower for estimate error
      revenue_max_usd: 40000000
      jobs_min: 20
      jobs_max: 500
      exclude_change_of_ownership: true   # bought recently: the owner is not a motivated seller
    bars:
      revenue_target_usd: [10000000, 30000000]
      revenue_core_usd: [12000000, 25000000]   # full size points; the rest of the target band gets 70%
      jobs_target: [20, 200]
      payroll_per_job_good_usd: 50000
    weights: {size: 30, jobs: 15, skilled_pay: 10, resilience: 15, forgiven: 10, entity: 10, history: 10}
    pass: 90                       # proxies are thin, so "pass" asks for nearly everything to line up
    review: 75
  max_per_run: 3000               # survivors stored per run, best first (the rest are counted, not kept)

# ==================================================================================================
# Poland (decisions.md E7). The KRS open API (api-krs.ms.gov.pl, free, no key) gives each company's current
# extract: legal form, registration date, PKD codes, shareholders, board, filed financial statements and any
# liquidation or bankruptcy. It cannot search by PKD, so discovery reads the daily KRS bulletin (every company
# with a register entry that day, which includes filing annual accounts) and keeps the PKD codes below. Filed
# numbers sit in the RDF repository, which is behind bot protection and is not crawled; they come from
# rejestr.io (paid) only when Sidarth approves that spend, otherwise from the seller.
# ==================================================================================================
pl:
  api: https://api-krs.ms.gov.pl/api/krs
  requests_per_second: 2
  legal_forms: ["SPÓŁKA Z OGRANICZONĄ ODPOWIEDZIALNOŚCIĄ", "SPÓŁKA AKCYJNA"]
  pkd_codes:                       # PKD 2007 subclasses, the same profile
    "33.12.Z": Repair of machinery
    "33.14.Z": Repair of electrical equipment
    "33.20.Z": Installation of industrial machinery and equipment
    "38.11.Z": Collection of non-hazardous waste
    "38.12.Z": Collection of hazardous waste
    "39.00.Z": Remediation
    "43.21.Z": Electrical installation
    "43.22.Z": Plumbing, heating, gas and air-conditioning installation
    "43.29.Z": Other construction installation
    "43.91.Z": Roofing
    "71.12.Z": Engineering activities and technical consultancy
    "71.20.B": Other technical testing and analysis
    "80.20.Z": Security systems service activities
    "81.21.Z": General cleaning of buildings
    "81.22.Z": Other building and industrial cleaning
    "81.29.Z": Other cleaning activities
    "81.30.Z": Landscape service activities
    "25.61.Z": Treatment and coating of metals
    "25.62.Z": Machining
    "28.29.Z": Other general-purpose machinery
    "46.69.Z": Wholesale of other machinery and equipment
    "77.32.Z": Renting of construction machinery
    "77.39.Z": Renting of other machinery
  sieve1:
    hard:
      min_years_in_krs: 10         # KRS opened in 2001; older firms re-registered 2001-2004
      exclude_liquidation_or_bankruptcy: true
      max_months_since_accounts_filed: 20
      exclude_corporate_majority_owner: true
    bars: {owner_age_motivated: 60, owner_age_watch: 55}
    weights: {history: 25, filings: 20, motivated_seller: 25, owner_operated: 15, capital: 15}
    pass: 60
    review: 40
    size_unknown_verdict: review   # without filed numbers no Polish company can pass sieve 1
