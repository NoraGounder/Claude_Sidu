# Layer 0: hard caps. The engine refuses any paid run that would push a vendor past its
# monthly budget. Raise a cap only when the user asks.

month_budget_usd:
  apify: 5          # = Apify Free plan's monthly credit, so Layer 1 costs nothing out of pocket
  leadmagic: 0       # not used: plans start at $99/month; FullEnrich covers people search and email
  fullenrich: 55     # FullEnrich Pro, about 1,000 credits a month (people search + work email)
  millionverifier: 5
  openrouter: 5     # TypeSafe Jev 1.14 decisions only (see ai.yaml). Actual cost per request is logged.

# Unit prices used for estimates before a run (USD per item). Apify's actual run cost
# replaces the estimate in the ledger when the run reports it. Check vendor pages monthly.
unit_price_usd:
  "harvestapi/linkedin-company-search:short": 0.002    # $2.00 per 1,000 on Free/Starter plan (2026-11-06)
  "harvestapi/linkedin-company-search:full": 0.004     # $4.00 per 1,000 on Free/Starter plan (2026-11-06)
  "harvestapi/linkedin-profile-search:full": 0.0032    # $3.20 per 1,000 (Apify store, 2026-11-06)
  # TypeSafe Jev 1.14: $0.042 per million input tokens, output free. A first test request
  # cost $0.000017; estimate $0.0001 per account request. Actual cost is logged in jev_calls.
  "openrouter:typesafe/jev-1.14:request": 0.0001
  # FullEnrich Pro: $55 per 1,000 credits. People search 0.25 credit per person returned;
  # work email 1 credit, only when found (docs.fullenrich.com, 2026-11-06).
  "fullenrich:credit": 0.055
  "fullenrich:person_returned": 0.01375
  "fullenrich:work_email": 0.055
  # MillionVerifier: about $37 per 10,000 checks (one-off credits). Used only to re-check stale emails.
  "millionverifier:check": 0.004

sending:
  # Launch plan (launch-plan.md): Tier 1-2 only, about 115 companies and 200 contacts, so 40 a day is
  # enough. 4-5 warmed mailboxes at <= 15/day carry that with headroom. Raise only on proven replies.
  max_emails_per_day: 40
  max_per_mailbox_per_day: 18
  max_contacts_per_account: 2
