# Layer 0: ideal customer profile. Layer 1 turns segments into searches; Layer 3 uses personas.
# Industry IDs are LinkedIn industry codes (v2), checked against
# github.com/HarvestAPI/linkedin-industry-codes-v2 on 2026-11-06.

version: 1

# Used by TypeSafe Jev 1.14 for ICP scoring. PROVISIONAL until the offer is confirmed.
buyer_profile: >-
  English-speaking companies in the United States, the United Kingdom or Ireland with 50-500
  employees in logistics, wholesale and distribution, installation and technical services, or
  manufacturing, that run operations and finance processes (invoices, orders, planning) where
  manual work can be automated or replaced with well-designed custom software.
# What we offer, in one line, for Jev's contact-relevance question. PROVISIONAL (open-questions.md).
offer_summary: >-
  Design-first automation and custom software for manual operations and finance work
  (invoices, orders, data entry). Mendix is not offered.

company:
  employees_min: 50
  employees_max: 500
  # Values passed to the Harvest company-size filter. Confirm the exact spelling on the
  # first live run (the engine stores the raw response, so a mismatch is easy to spot).
  linkedin_company_sizes: ["51-200", "201-500"]

industry_groups:
  logistics:
    label: Transport, logistics and warehousing
    ids: [116, 87, 92, 93]   # Transportation/Logistics/Supply Chain; Freight; Truck; Warehousing
  wholesale:
    label: Wholesale and distribution
    ids: [133, 134, 49, 1231, 1178, 1187, 1171, 1166]   # Wholesale; Import/Export; Building materials; Food; Hardware/Plumbing/Heating; Machinery; Electrical; Metals
  installation:
    label: Installation and technical services
    ids: [48, 435, 453, 51]  # Construction; Specialty trade contractors; Building equipment contractors; Civil engineering
  manufacturing:
    label: Manufacturing
    ids: [25, 55, 135, 840, 23, 743, 146]   # Manufacturing; Machinery; Industrial machinery; Fabricated metal; Food & beverage; Plastics & rubber; Packaging
  facilities:
    label: Facilities services
    ids: [122]

# One search per segment. LinkedIn caps a search at 20 pages x 50 companies = 1,000, so broad
# groups are split by country. max_items is per monthly run (4 x 300 full-mode companies = $4.80,
# inside Apify's free $5 a month); the next run continues from the next page.
#
# 2026-11-06: target market changed to English-speaking clients, US + UK + Ireland first.
# Industry groups below are PROVISIONAL: they fit an operations-automation offer, which Mithun has
# not confirmed yet (see open-questions.md). Enable segments only after the offer is confirmed.
segments:
  - {name: logistics_us,     enabled: false, industry_group: logistics,     locations: [United States],  max_items: 300}
  - {name: wholesale_us,     enabled: false, industry_group: wholesale,     locations: [United States],  max_items: 300}
  - {name: manufacturing_us, enabled: false, industry_group: manufacturing, locations: [United States],  max_items: 300}
  - {name: installation_us,  enabled: false, industry_group: installation,  locations: [United States],  max_items: 300}
  - {name: logistics_uk,     enabled: false, industry_group: logistics,     locations: [United Kingdom], max_items: 300}
  - {name: wholesale_uk,     enabled: false, industry_group: wholesale,     locations: [United Kingdom], max_items: 300}
  - {name: manufacturing_uk, enabled: false, industry_group: manufacturing, locations: [United Kingdom], max_items: 300}
  - {name: installation_uk,  enabled: false, industry_group: installation,  locations: [United Kingdom], max_items: 300}
  - {name: logistics_ie,     enabled: false, industry_group: logistics,     locations: [Ireland],        max_items: 300}
  - {name: wholesale_ie,     enabled: false, industry_group: wholesale,     locations: [Ireland],        max_items: 300}
  - {name: manufacturing_ie, enabled: false, industry_group: manufacturing, locations: [Ireland],        max_items: 300}
  - {name: installation_ie,  enabled: false, industry_group: installation,  locations: [Ireland],        max_items: 300}
  # Previous market (Dutch-speaking), kept for reference and tests. Not part of the current target.
  - {name: logistics_nl,     enabled: false, industry_group: logistics,     locations: [Netherlands],    max_items: 300}
  - {name: wholesale_nl,     enabled: false, industry_group: wholesale,     locations: [Netherlands],    max_items: 300}
  - {name: installation_nl,  enabled: false, industry_group: installation,  locations: [Netherlands],    max_items: 300}
  - {name: manufacturing_nl, enabled: false, industry_group: manufacturing, locations: [Netherlands],    max_items: 300}

allowed_countries: [US, GB, IE]   # English-speaking, cold-email rules allow B2B outreach with opt-out

exclusions:
  # Company names containing any of these are dropped in Layer 1 (case-insensitive).
  name_keywords:
    - uitzendbureau
    - uitzend
    - detachering
    - recruitment
    - staffing
    - werving
    - consultancy
    - consulting
    - software
    - automatisering
    - gemeente
    - provincie
    - rijkswaterstaat
    - ministerie
    # Seen in the first live Layer 2 sample: associations, port authorities, training bodies
    - vereniging
    - association
    - federatie
    - stichting
    - port of
    - havenbedrijf
    - training
    - academy
  domains: [themarblejar.io]
  # Real do-not-contact list (current clients, open deals, partners): private/exclusions.csv

# Layer 3: who we contact, in priority order. Max 2 per account.
personas:
  operations:
    - COO
    - Chief Operating Officer
    - Operations Director
    - Directeur Operations
    - Operationeel Directeur
    - Head of Operations
    - Hoofd Operations
    - Operations Manager
    - Manager Operations
    - Logistiek Manager
    - Supply Chain Manager
  finance:
    - CFO
    - Financieel Directeur
    - Finance Director
    - Finance Manager
    - Manager Financiën
    - Hoofd Financiële Administratie
    - Manager Financiële Administratie
  owner_led:          # use only for companies under about 150 employees
    - Algemeen Directeur
    - Managing Director
    - Directeur-eigenaar
    - CEO
  exclude_titles: [Intern, Stagiair, Assistant, Assistent, Student, Trainee]
