# Layer 5 copy for The Marble Jar. Written by people, filled only with facts we can show the source
# for (engine/gtm/layers/l5_copy.py). STATUS: PROVISIONAL. The offer is not confirmed yet
# (open-questions.md). English is the default; the Dutch text is kept from the previous market.
# Never mention Mendix.
#
# Rules: plain text, no links in email 1, short, no exclamation marks, informal "je" (common in
# Dutch B2B), the GDPR notice at the end of email 1. Placeholders in {curly_braces}.
# A hook is only used when its fact exists; otherwise the next one in `hook_priority` applies.

hook_priority: [admin_job_ad, growth, erp_mention, generic]
greetings:
  nl: ["Hoi", "Hallo", "Goedemorgen"]
  en: ["Hi", "Hello"]
signoffs:
  nl: ["Groet,", "Groeten,", "Hartelijke groet,"]
  en: ["Best,", "Kind regards,"]

process:                      # chosen per contact by Jev 1.14 (persona and industry)
  invoices:
    nl: "van binnenkomende factuur tot goedkeuring en boeking"
    en: "from incoming invoice to approval and booking"
  orders:
    nl: "van binnenkomende order (mail of pdf) tot verwerking in jullie systeem"
    en: "from incoming order (email or PDF) to entry in your system"

hooks:
  admin_job_ad:
    subject:
      nl: "vacature {job_title}"
      en: "your {job_title} vacancy"
    nl: "Ik zag dat {company} een {job_title} zoekt. Gaat een deel van dat werk nu nog met de hand?"
    en: "I saw the {job_title} vacancy at {company}. Is part of that work still done by hand?"
  growth:
    subject:
      nl: "{open_roles} vacatures bij {company}"
      en: "{open_roles} open roles at {company}"
    nl: "Ik zag dat {company} {open_roles} vacatures open heeft staan. Groeit de administratie makkelijk mee, of gaat daar nog veel met de hand?"
    en: "I saw that {company} has {open_roles} open roles. Does the admin side keep up easily, or is a lot of it still done by hand?"
  erp_mention:
    subject:
      nl: "{erp} bij {company}"
      en: "{erp} at {company}"
    nl: "Ik zag dat {company} met {erp} werkt. Komen orders of facturen daar nog met de hand in?"
    en: "I saw that {company} works with {erp}. Do orders or invoices still get entered into it by hand?"
  generic:
    subject:
      nl: "vraag over orders en facturen"
      en: "question about orders and invoices"
    nl: "Typen jullie bij {company} orders of facturen nog met de hand over? Bij veel bedrijven van jullie grootte kost dat elke week uren."
    en: "Does {company} still retype orders or invoices by hand? At many companies your size that costs hours every week."

steps:
  - day: 0
    nl: |
      {greeting} {first_name},

      {hook}

      Wij zijn The Marble Jar, een design-first studio in Breda. We automatiseren één zo'n proces in 2 tot 3 weken, voor een vaste prijs en bovenop jullie bestaande systemen: {process}.

      Zullen we in 45 minuten één proces met je doorlopen? Binnen 5 werkdagen heb je dan een klikbaar prototype van jullie eigen proces, kosteloos.

      {signoff}
      {sender_first_name}

      {gdpr_notice}
    en: |
      {greeting} {first_name},

      {hook}

      We are The Marble Jar, a design-first studio in Breda. We automate one such process in 2 to 3 weeks, at a fixed price and on top of your existing systems: {process}.

      Shall we walk through one process together in 45 minutes? Within 5 working days you would have a clickable prototype of your own process, free of charge.

      {signoff}
      {sender_first_name}

      {gdpr_notice}
  - day: 3
    nl: |
      {greeting} {first_name},

      Nog een aanvulling: we tekenen eerst samen met de mensen die het werk doen hoe het proces moet lopen, en bouwen pas daarna. Daardoor wordt het ook echt gebruikt.

      Op themarblejar.io staat een voorbeeld: een factuur die automatisch wordt uitgelezen, gecontroleerd, goedgekeurd en klaargezet voor betaling.

      Zou zo'n prototype voor {company} nuttig zijn?

      {sender_first_name}
    en: |
      {greeting} {first_name},

      One more thing: we first map how the process should run, together with the people who do the work, and only then build it. That is why it actually gets used.

      There is an example on themarblejar.io: an invoice that is read, checked, approved and queued for payment automatically.

      Would a prototype like that be useful for {company}?

      {sender_first_name}
  - day: 7
    nl: |
      {greeting} {first_name},

      Even concreet: een extra administratieve kracht kost al snel 40.000 tot 50.000 euro per jaar, elk jaar weer. Eén proces automatiseren is een eenmalige investering.

      Is dit iets voor jou, of is er iemand anders bij {company} die hierover gaat?

      {sender_first_name}
    en: |
      {greeting} {first_name},

      To put numbers on it: an extra admin employee easily costs 40,000 to 50,000 euros a year, every year. Automating one process is a one-off investment.

      Is this something for you, or is someone else at {company} the right person?

      {sender_first_name}
  - day: 14
    nl: |
      {greeting} {first_name},

      Ik wil je niet blijven mailen. Zal ik het hierbij laten, of past een gesprek over een paar maanden beter?

      {sender_first_name}
    en: |
      {greeting} {first_name},

      I don't want to keep emailing you. Shall I leave it here, or would a conversation in a few months suit you better?

      {sender_first_name}
