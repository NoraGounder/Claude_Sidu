# Layer 5 copy for The Marble Jar. Written by people, filled only with facts we can show the source
# for (engine/gtm/layers/l5_copy.py). Offer and claims follow decisions.md (2026-11-09): no
# integrations, timelines, fixed prices or free work. English only (decisions.md D21); the Dutch text is kept unused.
# Never mention Mendix.
#
# Rules: plain text, no links in email 1, short, no exclamation marks, informal "je" (common in
# Dutch B2B), the GDPR notice at the end of email 1. Placeholders in {curly_braces}.
# A hook is only used when its fact exists; otherwise the next one in `hook_priority` applies.

# growth is off: the open-roles count is not reliable enough to quote (audit C3, 2026-11-17).
# admin_hiring: a Jev-confirmed admin vacancy whose title cannot be quoted cleanly (audit M5).
# Every Tier 1-2 company has a confirmed admin vacancy, so the first supported hook is used, no Jev choice.
hook_priority: [admin_job_ad, admin_hiring, erp_mention, generic]
angle: priority

named_facts:
  erp: {signal: erp_mention, labels: [AFAS, Exact, Microsoft Dynamics, SAP, Twinfield, Unit4]}
  admin_hiring: {signal: admin_job_ad, qa: "An open administrative vacancy at the company (careers page or job posting)"}

# LinkedIn names with taglines: "Acme | Logistics for ..." -> "Acme" (audit M4).
company_name_cut: [" | ", " – ", " - "]

# Every email carries the opt-out (audit H1, decisions.md D18): `approve` refuses a draft without it.
every_step_must_contain: "'stop'"

greetings:
  nl: ["Hoi", "Hallo", "Goedemorgen"]
  en: ["Hi", "Hello"]
signoffs:
  nl: ["Groet,", "Groeten,", "Hartelijke groet,"]
  en: ["Best,", "Kind regards,"]

process:                      # chosen per contact by Jev 1.14 (persona and industry)
  invoices:
    nl: "van binnenkomende factuur tot goedkeuring en boeking"
    en: "from incoming invoice to approval and booking"
  orders:
    nl: "van binnenkomende order (mail of pdf) tot verwerking in jullie systeem"
    en: "from incoming order (email or PDF) to entry in your system"

hooks:
  admin_job_ad:
    subject:
      nl: "vacature {job_title}"
      en: "your {job_title} vacancy"
    nl: "Ik zag dat {company} een {job_title} zoekt. Hoeveel van dat werk is gegevens overtypen van de ene plek naar de andere?"
    en: "I saw the {job_title} vacancy at {company}. How much of that work is typing data from one place into another?"
  admin_hiring:
    needs: admin_hiring
    description: "Open with the fact that they are hiring for admin work (title not quotable)"
    subject:
      nl: "administratief werk bij {company}"
      en: "admin work at {company}"
    nl: "Ik zag dat {company} administratieve vacatures heeft openstaan. Hoeveel van dat werk is gegevens overtypen van de ene plek naar de andere?"
    en: "I saw that {company} is hiring for admin work. How much of that work is typing data from one place into another?"
  growth:
    subject:
      nl: "{open_roles} vacatures bij {company}"
      en: "{open_roles} open roles at {company}"
    nl: "Ik zag dat {company} {open_roles} vacatures open heeft staan. Groeit de administratie makkelijk mee, of gaat daar nog veel met de hand?"
    en: "I saw that {company} has {open_roles} open roles. Does the admin side keep up easily, or is a lot of it still done by hand?"
  erp_mention:
    subject:
      nl: "{erp} bij {company}"
      en: "{erp} at {company}"
    nl: "Ik zag dat {company} met {erp} werkt. Komen orders of facturen daar nog met de hand in?"
    en: "I saw that {company} works with {erp}. Do orders or invoices still get entered into it by hand?"
  generic:
    subject:
      nl: "orders en facturen bij {company}"
      en: "orders and invoices at {company}"
    nl: "Hoe komen orders en facturen bij {company} nu in jullie systeem: met de hand overgetypt, of al automatisch?"
    en: "How do incoming orders and invoices get into the systems at {company} today: typed in by hand, or already automated?"

steps:
  - day: 0
    nl: |
      {greeting} {first_name},

      {hook}

      Wij zijn The Marble Jar, een design-first studio in Breda. We ontwerpen en bouwen automatisering voor precies dit soort werk: {process}.

      Is een gesprek van 30 minuten de moeite waard om te kijken of een van jullie processen in aanmerking komt?

      {signoff}
      {sender_full_name}
      {sender_title}, Breda

      {gdpr_notice}
    en: |
      {greeting} {first_name},

      {hook}

      We are The Marble Jar, a design-first studio in Breda. We design and build automation for exactly this kind of work: {process}.

      Would a 30-minute call be worth it, to see whether one of your processes is a good fit?

      {signoff}
      {sender_full_name}
      {sender_title}, Breda

      {gdpr_notice}
  - day: 3
    nl: |
      {greeting} {first_name},

      Nog een aanvulling: we tekenen eerst samen met de mensen die het werk doen hoe het proces moet lopen, en bouwen pas daarna. Daardoor wordt het ook echt gebruikt.

      Op themarblejar.io staat een voorbeeld: een factuur die automatisch wordt uitgelezen, gecontroleerd, goedgekeurd en klaargezet voor betaling.

      Zou zoiets voor {company} nuttig zijn?

      {signoff}
      {sender_full_name}
      {sender_title}, Breda

      Liever geen mails meer? Antwoord dan 'stop'.
    en: |
      {greeting} {first_name},

      One more thing: we first map how the process should run, together with the people who do the work, and only then build it. That is why it actually gets used.

      There is an example on themarblejar.io: an invoice that is read, checked, approved and queued for payment automatically.

      Would something like that be useful for {company}?

      {signoff}
      {sender_full_name}
      {sender_title}, Breda

      Not relevant? Reply 'stop' and I won't email again.
  - day: 7
    nl: |
      {greeting} {first_name},

      Een vraag die vaak de doorslag geeft: als jullie team morgen geen orders en facturen meer hoeft over te typen, waar gaan die uren dan naartoe? Dat soort werk halen wij van het bureau.

      Is dit iets voor jou, of is er iemand anders bij {company} die hierover gaat?

      {signoff}
      {sender_full_name}
      {sender_title}, Breda

      Liever geen mails meer? Antwoord dan 'stop'.
    en: |
      {greeting} {first_name},

      A question that often decides it: if your team no longer had to retype orders and invoices, where would those hours go? That is the kind of work we take off people's desks.

      Is this something for you, or is someone else at {company} the right person?

      {signoff}
      {sender_full_name}
      {sender_title}, Breda

      Not relevant? Reply 'stop' and I won't email again.
  - day: 14
    nl: |
      {greeting} {first_name},

      Ik wil je niet blijven mailen. Zal ik het hierbij laten, of past een gesprek over een paar maanden beter?

      {signoff}
      {sender_full_name}
      {sender_title}, Breda

      Liever geen mails meer? Antwoord dan 'stop'.
    en: |
      {greeting} {first_name},

      I don't want to keep emailing you. Shall I leave it here, or would a conversation in a few months suit you better?

      {signoff}
      {sender_full_name}
      {sender_title}, Breda

      Not relevant? Reply 'stop' and I won't email again.
