# Layer 7: first answers Quailworks sends from the Smartlead inbox, in the founder's name, within a few
# working hours of an interested reply. Written by people; filled only with known values. Same rules as
# decisions.md: no results, timelines or prices in writing, and no promise beyond the one in email 2.
# {times} is the booking link when private/sender.yaml has one, otherwise two proposed slots.
# Most interested replies say "yes, send the list" (email 1 offers it, decisions.md Q31): the answer
# confirms the list, asks the one question that aims it, and offers the call without pushing it.

interested: |
  Thanks {first_name}, good to hear.

  I'll put the 10 companies together and send them within two working days. To aim the list well: which two or three kinds of companies would you most like more first meetings with?

  If you would rather talk it through first, {times}

  {sender_first_name}

question: |
  Thanks {first_name}, fair question.

  The honest answer depends on your market and your stack, so the quickest way is a short call where we
  look at your market together: {times}

  {sender_first_name}

referral: |
  Thanks {first_name}, that helps. Would you mind introducing me, or is it fine if I mention your
  name when I reach out?

  {sender_first_name}

times_with_link: "you can pick a time here: {booking_link}"
times_without_link: "would Tuesday or Thursday next week work for 30 minutes? Send me a time that suits you (US Central)."

# Lines for the meeting brief's "For the call" section ({sender} = the sender's first name).
call_prep:
  - "Ask how new customers find them today, which channel brings the best ones, and who takes first calls."
  - "Ask what a qualified first meeting is worth to them, their usual deal size, and which accounts they want most."
  - "Check the two conditions of the promise: a deal size of $20,000 or more, and at least 1,500 companies in their market."
  - "If it fits, offer the 90-day Signal Engine (offer.md): founding-client terms while places are open."
  - "Afterwards {sender} records one word: qualified, not a fit, or follow up."
