# Layer 5 copy for Quailworks' own outbound. Written by people, filled only with facts we can show the
# source for (engine/gtm/layers/l5_copy.py). Offer and claims follow decisions.md (2026-11-10): no
# results, guarantees, timelines or prices; no client names.
#
# Rules: plain text, no links in email 1, short, no exclamation marks, openings are questions that
# presume nothing, the GDPR notice at the end of email 1. Placeholders in {curly_braces}.
# A hook is only used when its fact exists; otherwise the next one in `hook_priority` applies.

hook_priority: [sales_job_ad, trade_show, certification, growth, sales_stack, generic]
# The most specific supported opening goes first; Jev 1.14's fact check still falls back down this list.
# (First drafts, 2026-11-10: with Jev choosing, 155 of 185 emails used the generic opening.)
angle: priority

# Quote a clean role name when a confirmed open job title contains it. Careers pages often glue the job
# description onto the title, so the raw title is never quoted. First match wins (most specific first).
quote_titles:
  - {label: "sales development representative", pattern: 'sales\s+development\s+rep|\bSDR\b'}
  - {label: "business development representative", pattern: 'business\s+development\s+rep|\bBDR\b'}
  - {label: "founding account executive", pattern: 'founding\s+account\s+executive'}
  - {label: "account executive", pattern: 'account\s+executive'}
  - {label: "sales engineer", pattern: 'sales\s+engineer'}
  - {label: "business development manager", pattern: 'business\s+development\s+manager'}
  - {label: "business development director", pattern: 'director,?\s+(of\s+)?business\s+development|business\s+development\s+director|head\s+of\s+business\s+development'}
  - {label: "sales director", pattern: 'sales\s+director|director,?\s+(of\s+)?sales\b|head\s+of\s+sales'}
  - {label: "inside sales representative", pattern: 'inside\s+sales'}
  - {label: "sales manager", pattern: '\bsales\s+manager'}
job_title_qa: "Open job listed on their careers page"
# LinkedIn page names often carry a tagline: "Vimachem - IIoT Pharma 4.0 AI Platform" -> "Vimachem".
company_name_cut: [" | ", " - ", " – ", " — ", ", powered by", ": "]
greetings:
  en: ["Hi", "Hello"]
signoffs:
  en: ["Best,", "Thanks,"]

# Facts quoted from evidence labels (scoring.yaml `detect`), with the source URL kept for review.
named_facts:
  stack: {signal: sales_stack, qa: "Sales tool named in one of their job ads", labels: [HubSpot, Salesforce, Pipedrive, Zoho CRM, Apollo, ZoomInfo, Salesloft, Outreach]}
  trade_show: {signal: trade_show, qa: "Trade show named on their website", labels: [IMTS, FABTECH, ProMat, MODEX, Automate, PACK EXPO, Hannover Messe, SEMICON,
                                            The Assembly Show, Paris Air Show, Farnborough, MRO Americas, Space Symposium,
                                            AeroDef, SAE WCX, The Battery Show, CAMX, JEC World, RAPID + TCT, Formnext,
                                            Autosport International, Advanced Engineering, MACH, Space-Comm Expo,
                                            Engineering Design Show]}
  # ITAR is a registration, not a certification, so it scores but is not quoted.
  certification: {signal: supplier_certification, qa: "Certification named on their website", labels: [AS9100, IATF 16949, NADCAP]}

# English role words that make a vacancy title quotable ("account executive", "sales engineer").
title_role_words: 'representative|\brep\b|executive|manager|engineer|specialist|associate|developer|director'
company_suffixes: [inc, incorporated, llc, l.l.c., ltd, corp, corporation]
# Never in an automatically approved draft (decisions.md Q3, Q4).
banned_phrases: [guarantee, marble jar, case study, per month, in days]

# One example process, so Jev 1.14 is not asked to choose one.
process:
  outbound:
    description: Finding companies with a reason to buy and writing to the right person
    en: "spotting companies with a reason to buy now, writing to the right person"

hooks:
  sales_job_ad:
    needs: job_title
    description: Open with the sales or business development role they are hiring for
    subject:
      en: "your {job_title} opening"
    en: "I saw the {job_title} opening at {company}. Where will that person's first conversations come from: a list you already have, or one they build from scratch?"
  trade_show:
    needs: trade_show
    description: Open with the trade show their website mentions
    subject:
      en: "{trade_show} and {company}"
    en: "I saw {trade_show} mentioned on the {company} website. Outside of shows like that, how do first conversations with new customers usually start?"
  certification:
    needs: certification
    description: Open with the aerospace or automotive quality certification on their website
    subject:
      en: "{certification} at {company}"
    en: "I saw the {certification} certification on the {company} website. When an engineering team starts a new program, how do they usually find you: RFQs, trade shows, or someone reaching out?"
  growth:
    needs: open_roles
    description: Open with how many roles they are hiring for (growth)
    subject:
      en: "{open_roles} open roles at {company}"
    en: "I saw {company} has {open_roles} open roles. Is finding new customers keeping pace with that, or is it the harder part to grow?"
  sales_stack:
    needs: stack
    description: Open with the CRM or sales tool named in their job ads
    subject:
      en: "{stack} at {company}"
    en: "I saw a job ad at {company} that mentions {stack}. How do new accounts get into {stack} today: added by hand, or already automated?"
  generic:
    needs: null
    description: Open with how they find new customers today
    subject:
      en: "next customers at {company}"
    # A pure question: the first version listed channels and was flagged as an assumption in 43% of drafts.
    en: "Quick question: how does {company} find its next customers today?"

steps:
  - day: 0
    en: |
      {greeting} {first_name},

      {hook}

      I run Quailworks, a GTM engineering firm. Before that I spent over a decade as a design engineer, from launch-vehicle turbopumps to hypercar suspension: the person suppliers were trying to reach.

      We build signal-based outbound for companies that sell to engineering teams: {process}, and booking the first call. You own all of it.

      Worth a 30-minute working session? You'd get a written note on the three things I'd fix first, whether or not we work together.

      {signoff}
      {sender_first_name}

      {gdpr_notice}
  - day: 3
    en: |
      {greeting} {first_name},

      A bit more on how it works: the system watches for reasons to reach out, such as a company hiring sales staff, exhibiting at a show or growing. It then finds the right person and writes from facts on that company's own website, with the source for each one.

      We build it the way you would build hardware: a written spec first, then tests on real data and monitoring once it runs. This email came out of the same kind of system.

      Would something like that help {company}?

      {sender_first_name}
  - day: 7
    en: |
      {greeting} {first_name},

      If a call is too much right now: I can send you 10 companies in your market that show one of these signals today, each with its source, so you can judge the quality yourself.

      Want me to put that list together?

      {sender_first_name}
  - day: 14
    en: |
      {greeting} {first_name},

      I don't want to keep emailing you. Shall I leave it here, or would a conversation in a few months suit you better?

      {sender_first_name}
