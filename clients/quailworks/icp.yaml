# Layer 0: ideal customer profile. Layer 1 turns segments into searches; Layer 3 uses personas.
# Industry IDs are LinkedIn industry codes (v2), checked against
# github.com/HarvestAPI/linkedin-industry-codes-v2 on 2026-11-10.

version: 1

# Used by TypeSafe Jev 1.14 for ICP scoring (decisions.md Q8-Q10).
buyer_profile: >-
  US and UK companies with 11-500 employees that sell business-to-business products or services to hardware
  engineering teams in aerospace, space, automotive and advanced manufacturing: component and
  precision-parts suppliers, and software, test or engineering tools for those teams. Their buyers are
  design, test and supplier-quality engineers who are hard to reach, so new business depends on trade
  shows, distributors, referrals and a small sales or business-development team.
# What we offer, in one line, for Jev's contact-relevance question (decisions.md Q1).
offer_summary: >-
  Signal-based outbound built as a system: finds accounts showing a reason to buy, writes to the right
  person from facts on their own website, and books first meetings; built in the client's own tools.

company:
  employees_min: 11
  employees_max: 500
  # Values passed to the Harvest company-size filter (same spelling as The Marble Jar's live runs).
  linkedin_company_sizes: ["11-50", "51-200", "201-500"]

industry_groups:
  aerospace_suppliers:
    label: Aerospace, defense and space suppliers
    ids: [52, 1]             # Aviation and Aerospace Component Manufacturing; Defense and Space Manufacturing
  automotive_suppliers:
    label: Automotive parts suppliers
    ids: [1042]              # Motor Vehicle Parts Manufacturing
  eng_software:
    label: Software for manufacturing and engineering teams
    ids: [4]                 # Software Development, narrowed by the segment's search word
  automation:
    label: Industrial automation and robotics
    ids: [147, 3247, 3248]   # Automation Machinery Manufacturing; Robot Manufacturing; Robotics Engineering
  engineering_services:
    label: Engineering services
    ids: [3242]              # Engineering Services, narrowed by the segment's search word
  precision_parts:
    label: Precision parts and fabrication
    ids: [876, 840]          # Turned Products and Fastener Manufacturing; Fabricated Metal Products
  instruments:
    label: Measuring, control and electrical equipment
    ids: [983, 2468]         # Measuring and Control Instrument Manufacturing; Electrical Equipment Manufacturing
  machinery:
    label: Industrial machinery
    ids: [135, 55, 928]      # Industrial Machinery; Machinery; Metalworking Machinery Manufacturing

# One search per segment. 2,700 full-mode companies = $10.80 on the paid Apify plan (decisions.md Q20).
# Discovery is cheap, so it is broad; sending stays narrow (Tier 1-2 only, sending.yaml).
# search_query narrows a broad industry; confirm on the first live run (the raw response is stored).
segments:
  - {name: aerospace_suppliers_us,  enabled: true,  industry_group: aerospace_suppliers,  locations: [United States], max_items: 300}
  - {name: automotive_suppliers_us, enabled: true,  industry_group: automotive_suppliers, locations: [United States], max_items: 300}
  - {name: eng_software_us,         enabled: true,  industry_group: eng_software,         locations: [United States], max_items: 300, search_query: manufacturing}
  - {name: automation_us,           enabled: true,  industry_group: automation,           locations: [United States], max_items: 300}
  - {name: engineering_services_us, enabled: true,  industry_group: engineering_services, locations: [United States], max_items: 300, search_query: aerospace}
  # United Kingdom from the start (decisions.md Q8): the founder's own engineering market.
  - {name: aerospace_suppliers_uk,  enabled: true,  industry_group: aerospace_suppliers,  locations: [United Kingdom], max_items: 300}
  - {name: automotive_suppliers_uk, enabled: true,  industry_group: automotive_suppliers, locations: [United Kingdom], max_items: 300}
  - {name: motorsport_engineering_uk, enabled: true, industry_group: engineering_services, locations: [United Kingdom], max_items: 300, search_query: motorsport}
  - {name: eng_software_uk,         enabled: true,  industry_group: eng_software,         locations: [United Kingdom], max_items: 300, search_query: manufacturing}
  # Phase 2: only after the first segments show a working message (launch-plan.md).
  - {name: precision_parts_us,      enabled: false, industry_group: precision_parts,      locations: [United States], max_items: 300}
  - {name: instruments_us,          enabled: false, industry_group: instruments,          locations: [United States], max_items: 300}
  - {name: machinery_us,            enabled: false, industry_group: machinery,            locations: [United States], max_items: 300}

# US CAN-SPAM and UK PECR: opt-out and postal address in every first email (gate.yaml). PECR allows
# business email to corporate subscribers (limited companies); the 11+ employee floor keeps sole traders out.
allowed_countries: [US, GB]

exclusions:
  # Company names containing any of these are dropped in Layer 1 (case-insensitive substring).
  name_keywords:
    - lead generation
    - leadgen
    - demand generation
    - appointment setting
    - sales outsourcing
    - marketing agency
    - digital agency
    - growth agency
    - staffing
    - recruiting
    - recruitment
    - university
    - college
    - school
    - association
    - foundation
  # Quailworks itself and its client (decisions.md Q14). Real do-not-contact list: private/exclusions.csv
  domains: [quailworks.co, quailworks.xyz, themarblejar.io]

# Layer 3: who we contact, in priority order. Max 2 per account (scoring.yaml enrichment_policy).
personas:
  sales_leader:
    - Chief Revenue Officer
    - CRO
    - VP Sales
    - VP of Sales
    - Vice President of Sales
    - Vice President Sales
    - Head of Sales
    - Sales Director
    - Director of Sales
    - VP Business Development
    - Head of Business Development
    - Director of Business Development
    - Business Development Director
    - Business Development Manager   # often the senior seller at aerospace and automotive suppliers (Q11)
    - Commercial Director            # the usual UK title for the head of sales
    - Head of Commercial
    - Head of Growth
    - Head of Revenue Operations
  marketing_leader:
    - CMO
    - Chief Marketing Officer
    - VP Marketing
    - VP of Marketing
    - Head of Marketing
    - Marketing Director
    - Director of Marketing
  owner_led:          # used only for companies under about 150 employees (Layer 3)
    - CEO
    - Chief Executive Officer
    - Founder
    - Co-Founder
    - Owner
    - President
    - Managing Director
    - General Manager
  # An entry matches at a word end but not inside a longer word ("Intern" keeps "International Sales Director").
  exclude_titles: [Intern, Internship, Student, Trainee, Traineeship, Assistant, Coordinator, Representative, Product Owner]
