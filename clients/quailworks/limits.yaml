# Layer 0: hard caps. The engine refuses any paid run that would push a vendor past its
# monthly budget. Raise a cap only when the user asks.
#
# Shared vendor accounts (decisions.md Q20): the guard counts each client's own spend, so these caps
# are set so that Quailworks and The Marble Jar together stay inside what the accounts already have.

month_budget_usd:
  # Apify's free $5 credit is shared. The Marble Jar used $4.80 of it in November 2026 and needs no new
  # discovery for its launch, so Quailworks' first discovery runs on or after 1 December 2026.
  apify: 5
  leadmagic: 0       # not used
  # FullEnrich credits are shared (about 770 left after The Marble Jar's run): about 360 credits here.
  fullenrich: 20
  millionverifier: 2
  openrouter: 2      # TypeSafe Jev 1.14 decisions only (see ai.yaml). Actual cost per request is logged.

# Unit prices used for estimates before a run (USD per item), as for The Marble Jar (checked 2026-11-06).
unit_price_usd:
  "harvestapi/linkedin-company-search:short": 0.002
  "harvestapi/linkedin-company-search:full": 0.004
  "harvestapi/linkedin-profile-search:full": 0.0032
  "openrouter:typesafe/jev-1.14:request": 0.0001
  "fullenrich:credit": 0.055
  "fullenrich:person_returned": 0.01375
  "fullenrich:work_email": 0.055
  "millionverifier:check": 0.004

sending:
  # Launch (decisions.md Q19): Tier 1-2 only, 20 a day from 4 mailboxes at <= 10 each.
  max_emails_per_day: 20
  max_per_mailbox_per_day: 10
  max_contacts_per_account: 2
