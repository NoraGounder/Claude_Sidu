# Layer 0: hard caps. The engine refuses any paid run that would push a vendor past its
# monthly budget. Raise a cap only when the user asks.
#
# 2026-11-10: the user said not to wait and to buy what is needed (a paid Apify plan, more FullEnrich
# credits, more mailboxes), so these caps are above the free tiers (decisions.md Q20). Vendor accounts
# are shared with The Marble Jar, whose own caps are unchanged; the guard counts each client separately.

month_budget_usd:
  apify: 15          # paid Apify plan (Starter); first run 2,700 companies = $10.80
  leadmagic: 0       # not used
  fullenrich: 40     # ~730 credits: people search plus work emails for ~150 Tier 1-2 accounts
  millionverifier: 2
  openrouter: 3      # TypeSafe Jev 1.14 decisions only (see ai.yaml). Actual cost per request is logged.

# Unit prices used for estimates before a run (USD per item), as for The Marble Jar (checked 2026-11-06).
unit_price_usd:
  "harvestapi/linkedin-company-search:short": 0.002
  "harvestapi/linkedin-company-search:full": 0.004
  "harvestapi/linkedin-profile-search:full": 0.0032
  "openrouter:typesafe/jev-1.14:request": 0.0001
  "fullenrich:credit": 0.055
  "fullenrich:person_returned": 0.01375
  "fullenrich:work_email": 0.055
  "millionverifier:check": 0.004

sending:
  # 6 fresh brand mailboxes after 2-3 weeks of warm-up (decisions.md Q18-Q19). Ramp agreed in the plan:
  # week 1: 5 a day each (30); week 2: 10 (60); week 3 on: 15 (90), each step only if bounces stay under
  # 2% and there are no spam complaints. These values are week 1; Claude Code raises them per the ramp.
  max_emails_per_day: 30
  max_per_mailbox_per_day: 5
  max_contacts_per_account: 2
