# Layer 4: send gate. Deterministic rules (engine/gtm/layers/l4_gate.py). A contact is "ready" only
# when every rule passes; "held" means it may pass later; "rejected_l4" means never send.

accepted_email_status: [DELIVERABLE, HIGH_PROBABILITY]   # FullEnrich verification results
# A third of the first run's emails were "high probability", not confirmed. Fresh mailboxes cannot
# afford bounces, so these wait until MillionVerifier has checked them (`gate --recheck`, where the key
# is set; about $0.004 each). Verified ones become DELIVERABLE, the rest are rejected.
# Since 2026-11-11 also the "deliverable" ones: a second finder disagreed with 2 of 7 of them (Q39).
verify_statuses: [HIGH_PROBABILITY, DELIVERABLE]

catch_all:                     # the mail server accepts any address, so delivery can't be confirmed
  allowed_tiers: [tier_1, tier_2]
  max_share_of_ready: 0.15     # at most 15% of ready contacts, to protect sender reputation

freshness_days: 45             # older verifications are re-checked with MillionVerifier before sending

contact_countries: [US, GB]    # contact's own location, when known (decisions.md Q8)

role_prefixes: [info, sales, contact, office, admin, hello, support, finance, hr, jobs, careers, service,
                noreply, no-reply, orders, order, mail, team, marketing, press, media, webmaster, quotes,
                rfq, billing, accounts, inquiries, enquiries]

free_mail_domains: [gmail.com, googlemail.com, hotmail.com, outlook.com, live.com, msn.com, yahoo.com,
                    icloud.com, me.com, aol.com, protonmail.com, proton.me, comcast.net, att.net,
                    verizon.net, sbcglobal.net, btinternet.com, sky.com, virginmedia.com, hotmail.co.uk,
                    yahoo.co.uk]

require_sender_consent: true   # client.yaml sender.consent_to_send_in_name must be "granted"

# GDPR Art. 14 (Quailworks is established in the EU, decisions.md Q16), US CAN-SPAM and UK PECR: the
# source of the data, an easy opt-out and the sender's postal address, from the Polish company register.
gdpr_notice:
  en: "I found your business contact details via LinkedIn and FullEnrich. Prefer not to hear from me? Just reply 'stop'. Quailworks sp. z o.o., ul. Mikołaja Reja 34, 26-225 Gowarczów, Poland."
